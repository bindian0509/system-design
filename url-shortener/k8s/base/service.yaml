apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app: url-shortener
    app.kubernetes.io/name: url-shortener
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: url-shortener
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-headless
  namespace: url-shortener
  labels:
    app: url-shortener
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: url-shortener
