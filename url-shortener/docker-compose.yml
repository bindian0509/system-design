services:
  # URL Shortener application
  url-shortener:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=debug
      - ENVIRONMENT=development
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=sqlite:/app/data/urls.db?mode=rwc
      - CACHE_TYPE=memory
      - BASE_URL=http://localhost:8080
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./Cargo.toml:/app/Cargo.toml
      - url-data:/app/data
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    networks:
      - url-shortener-network

  # Redis for caching (optional, start with: docker-compose --profile redis up -d)
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - url-shortener-network

  # LocalStack for AWS services (DynamoDB, S3, Kinesis)
  # Only needed if using DATABASE_TYPE=dynamodb
  # Start with: docker-compose --profile aws up -d
  localstack:
    image: localstack/localstack:3.0
    profiles:
      - aws
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=dynamodb,s3,kinesis,secretsmanager
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - url-shortener-network

  # Grafana for dashboards (optional)
  # Start with: docker-compose --profile monitoring up -d
  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - url-shortener-network

volumes:
  url-data:
  redis-data:
  localstack-data:
  grafana-data:
  cargo-cache:
  target-cache:

networks:
  url-shortener-network:
    driver: bridge
