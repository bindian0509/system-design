version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oauth2-postgres
    environment:
      POSTGRES_DB: oauth2db
      POSTGRES_USER: oauth2user
      POSTGRES_PASSWORD: oauth2pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2user -d oauth2db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
