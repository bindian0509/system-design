services:
  scylla:
    image: cassandra:4.1
    container_name: scylla
    environment:
      - CASSANDRA_CLUSTER_NAME=products_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/cassandra

  scylla-init:
    image: cassandra:4.1
    depends_on:
      - scylla
    volumes:
      - ../cql:/cql
    entrypoint: ["/bin/bash", "-c", "echo 'Waiting for Cassandra...' && until cqlsh scylla 9042 -e 'DESCRIBE CLUSTER' 2>/dev/null; do sleep 5; done && echo 'Running init script...' && cqlsh scylla 9042 -f /cql/init.cql && echo 'Init complete!'"]
    restart: "no"

  products-api:
    build:
      context: .
    image: products-api:latest
    depends_on:
      - scylla
    environment:
      - CASSANDRA_CONTACT_POINTS=scylla
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=products
      - CASSANDRA_DATACENTER=datacenter1
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  scylla-data:
