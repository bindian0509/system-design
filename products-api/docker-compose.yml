version: "3.9"

services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: scylla
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1"]
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' 127.0.0.1 9042"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - scylla-data:/var/lib/scylla

  scylla-init:
    image: scylladb/scylla:5.4
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./cql:/cql
    entrypoint: ["/bin/sh", "-c", "until cqlsh scylla 9042 -e \"DESCRIBE KEYSPACES\" >/dev/null 2>&1; do echo 'waiting for scylla'; sleep 2; done; cqlsh scylla 9042 -f /cql/init.cql"]

  products-api:
    build:
      context: ./products-api
    image: products-api:latest
    depends_on:
      scylla-init:
        condition: service_completed_successfully
    environment:
      - CASSANDRA_CONTACT_POINTS=scylla
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=products
      - CASSANDRA_DATACENTER=datacenter1
    ports:
      - "8080:8080"

  cassandra-web:
    image: ipushc/cassandra-web:0.5.0
    depends_on:
      scylla:
        condition: service_healthy
    environment:
      - CASSANDRA_HOST=scylla
      - CASSANDRA_PORT=9042
    ports:
      - "3000:3000"

volumes:
  scylla-data:
